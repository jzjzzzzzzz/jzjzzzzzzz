<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Zhixuan (John) Zhou — building systems that work</title>
  <desc id="desc">An animated network of connected ideas beside a short introduction to John's open-source AI and research software.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0b1225"/><stop offset=".55" stop-color="#10234a"/><stop offset="1" stop-color="#073c52"/></linearGradient>
    <linearGradient id="trace" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#22d3ee" stop-opacity=".21"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="24"/></clipPath>
  </defs>
  <style>
    .orbit { transform-origin: 957px 150px; animation: orbit 28s linear infinite; }
    .orbit.reverse { animation-direction: reverse; animation-duration: 38s; }
    .signal { stroke-dasharray: 8 13; animation: flow 9s linear infinite; }
    .pulse { animation: pulse 3.6s ease-in-out infinite; }
    .pulse.delay { animation-delay: -1.8s; }
    .float { animation: float 7s ease-in-out infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes flow { to { stroke-dashoffset: -210; } }
    @keyframes pulse { 50% { opacity: .45; } }
    @keyframes float { 50% { transform: translateY(-7px); } }
    @media (prefers-reduced-motion: reduce) { .orbit, .signal, .pulse, .float { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#background)"/>
    <circle cx="961" cy="150" r="250" fill="url(#halo)"/>
    <g stroke="#9bdcf2" stroke-opacity=".09">
      <path d="M0 50H1200M0 100H1200M0 150H1200M0 200H1200M0 250H1200"/>
      <path d="M50 0V300M100 0V300M150 0V300M200 0V300M250 0V300M300 0V300M350 0V300M400 0V300M450 0V300M500 0V300M550 0V300M600 0V300M650 0V300M700 0V300M750 0V300M800 0V300M850 0V300M900 0V300M950 0V300M1000 0V300M1050 0V300M1100 0V300M1150 0V300"/>
    </g>
    <path d="M0 299H1200" stroke="url(#trace)" stroke-width="3"/>
    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <rect x="64" y="43" width="233" height="30" rx="15" fill="#67e8f9" fill-opacity=".13" stroke="#67e8f9" stroke-opacity=".42"/>
      <circle cx="81" cy="58" r="4" fill="#67e8f9" class="pulse"/>
      <text x="95" y="63" fill="#a5f3fc" font-size="13" font-weight="700" letter-spacing="1.5">OPEN SOURCE · RESEARCH</text>
      <text x="63" y="137" fill="#fff" font-size="53" font-weight="800" letter-spacing="-2">Zhixuan (John) Zhou</text>
      <text x="65" y="178" fill="#cbd5e1" font-size="22" font-weight="600">Building systems that work.</text>
      <text x="65" y="217" fill="#b7d9e9" font-size="17">Grounded agents · Human-in-the-loop APIs · Automation</text>
      <text x="65" y="244" fill="#b7d9e9" font-size="17">Computer vision · Scientific modeling</text>
    </g>
    <g fill="none" stroke="#7dd3fc" stroke-opacity=".24"><circle cx="957" cy="150" r="71"/><circle cx="957" cy="150" r="112" stroke-dasharray="3 10"/><circle cx="957" cy="150" r="146" stroke-opacity=".12"/></g>
    <g class="orbit"><path d="M957 38A112 112 0 0 1 1069 150" fill="none" stroke="url(#trace)" stroke-width="3" stroke-linecap="round"/><circle cx="957" cy="38" r="5" fill="#67e8f9"/></g>
    <g class="orbit reverse"><path d="M811 150A146 146 0 0 1 957 4" fill="none" stroke="#a78bfa" stroke-width="2" stroke-opacity=".75" stroke-linecap="round"/></g>
    <g class="float">
      <path d="M893 115 957 150 1023 109M957 150 994 210" fill="none" stroke="url(#trace)" stroke-width="3" class="signal"/>
      <circle cx="957" cy="150" r="36" fill="#102a48" stroke="#67e8f9" stroke-width="2"/><circle cx="957" cy="150" r="26" fill="#123d59"/>
      <text x="957" y="157" fill="#fff" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">JZ</text>
      <circle cx="893" cy="115" r="11" fill="#67e8f9" class="pulse"/><circle cx="1023" cy="109" r="9" fill="#a78bfa" class="pulse delay"/><circle cx="994" cy="210" r="10" fill="#fcd34d" class="pulse"/>
    </g>
  </g>
</svg>
