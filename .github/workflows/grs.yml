name: Update GitHub stats card

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/grs.yml
      - scripts/update_profile_badges.py
      - scripts/validate_profile.py

concurrency:
  group: profile-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate self-hosted follower and star badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_profile_badges.py

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&locale=en&include_all_commits=true&disable_animations=true
          path: profile/stats-en.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&card_width=467&theme=github_dark&locale=en&disable_animations=true
          path: profile/top-langs-en.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Reject missing or error images before publishing
        run: python3 scripts/validate_profile.py --assets-only

      - name: Commit stats cards and badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats-en.svg profile/top-langs-en.svg profile/followers.svg profile/stars.svg
          git diff --cached --quiet || git commit -m "chore(profile): refresh GitHub stats card"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
