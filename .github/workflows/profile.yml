name: Validate profile

on:
  pull_request:
    paths:
      - README.md
      - scripts/**
      - tests/**
      - assets/**
      - profile/**
      - .github/workflows/**
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/**
      - tests/**
      - assets/**
      - profile/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run profile regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate profile images and curated repository links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/validate_profile.py README.md
